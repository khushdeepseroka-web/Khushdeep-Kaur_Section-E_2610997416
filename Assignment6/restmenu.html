<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Restaurant Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🍽️ Delicious Bites Restaurant</h1>
        <p>Click on any food item to view its details</p>
    </header>

    <main>
        <h2>Interactive Food Menu</h2>

        <!-- Restaurant Food Image -->
        <img
            src="Restaurant Favorites Food Collage.png"
            alt="Restaurant table with different food items"
            usemap="#restaurantmap"
        >

        <!-- Image Map -->
        <map name="restaurantmap">

            <area
                shape="circle"
                coords="301,215,201"
                href="https://pizzawings.co.in/"
                alt="Pizza"
                target="_blank">

            <area
                shape="rect"
                coords="1169,64,1370,484"
                href="https://www.dominos.co.in/"
                alt="French Fries"
                target="_blank">

            <area
                shape="poly"
                coords="513,719,722,540,900,640,946,652,945,900,552,836"
                href="https://roasterycoffee.co.in/"
                alt="sandwich"
                target="_blank">


            <area
                shape="circle"
                coords="868,267,10"
                href="https://bossburger.in/"
                alt="Burger"
                target="_blank">


            <area
                shape="poly"
                coords="1125,620,1170,555,1370,500,1480,560,1500,750,1450,850,1125,780"
                href="https://www.bakingo.com/?srsltid=AYCX9vLmhy9lWgjpy7LO68-KnS5zWZSAcPnS15CogG1kuywuH43G0HAC"
                alt="Slice of Cake"
                target="_blank">

            <area
                shape="default"
                href="https://www.barbequenation.com/"
                target="_blank">
        </map>
            

            <h3>How to use the menu?</h3>
            <p>
                Click on different areas of the food image.
                Each food item opens its own webpage.
            </p>

</body>
</html>
