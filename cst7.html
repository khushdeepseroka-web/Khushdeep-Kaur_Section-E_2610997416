<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive Restaurant Menu</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        h1 {
            color: #8b0000;
        }

        .menu-container {
            background: white;
            width: 90%;
            max-width: 1000px;
            margin: auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 15px #aaa;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 3px solid #8b0000;
            border-radius: 10px;
        }

        #message {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-radius: 8px;
            font-size: 18px;
            color: #333;
        }
    </style>
</head>

<body>

<div class="menu-container">

    <h1>🍴 Interactive Restaurant Menu 🍴</h1>

    <p>Click on different food items in the image.</p>

    <img src="https://img.magnific.com/free-photo/top-view-fast-food-mix-mozzarella-sticks-club-sandwich-hamburger-mushroom-pizza-caesar-shrimp-salad-french-fries-ketchup-mayo-cheese-sauces-table_141793-3998.jpg?semt=ais_hybrid&w=740&q=80"
         alt="Restaurant Menu"
         usemap="#restaurantmap"
         width="800"
         height="500">

    <map name="restaurantmap">

        <!-- Pizza - Circle -->
        <area shape="circle"
              coords="450,370,70"
              href="#"
              alt="Pizza"
              onclick="showItem('Pizza')">

        <!-- Burger - Circle -->
        <area shape="circle"
              coords="650,120,60"
              href="#"
              alt="Burger"
              onclick="showItem('Burger')">

        <!-- French Fries - Rectangle -->
        <area shape="rect"
              coords="350,150,450,230"
              href="#"
              alt="French Fries"
              onclick="showItem('French Fries')">

        <!-- Menu Card - Rectangle -->
        <area shape="rect"
              coords="480,40,600,140"
              href="#"
              alt="Menu Card"
              onclick="showItem('Menu Card')">

        <!-- Sandwich - Polygon -->
        <area shape="poly"
              coords="120,80,220,50,280,110,250,180,150,160"
              href="#"
              alt="Sandwich"
              onclick="showItem('Sandwich')">

        <!-- Cake Slice - Polygon -->
        <area shape="poly"
              coords="650,300,730,260,780,330,700,370"
              href="#"
              alt="Cake Slice"
              onclick="showItem('Cake Slice')">

        <!-- Remaining / Other Area -->
        <area shape="default"
              href="#"
              alt="Other Area"
              onclick="showItem('Other Area')">

    </map>

    <div id="message">
        Select a food item from the image.
    </div>

</div>

<script>
    function showItem(item) {
        document.getElementById("message").innerHTML =
            "<strong>You selected:</strong> " + item;
    }
</script>

</body>
</html>
